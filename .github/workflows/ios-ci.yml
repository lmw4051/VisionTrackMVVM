name: iOS Simulator CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only newer runs for the same PR cancel one another.
# Pushes and manual runs have unique groups, separate from PR groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IOS_CI_DEVICE: iPhone 18 Pro
  IOS_CI_OS: '27.2'

defaults:
  run:
    shell: bash

jobs:
  debug-unit:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      CI_MODE: unit
    steps: &simulator-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode and prepare isolated diagnostics
        run: |
          set -euo pipefail
          developer_dir=/Applications/Xcode_27.2.app/Contents/Developer
          if [[ ! -d "$developer_dir" ]]; then
            echo "::error::Required Xcode 27.2 is not installed at $developer_dir"
            exit 69
          fi
          export DEVELOPER_DIR="$developer_dir"
          xcodebuild -version
          if [[ "$(xcodebuild -version | head -n 1)" != 'Xcode 27.2' ]]; then
            echo "::error::Selected Xcode is not version 27.2"
            exit 69
          fi
          command -v python3
          printf 'Runner image: %s (%s)\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          sw_vers
          uname -m
          run_dir=$(mktemp -d "$RUNNER_TEMP/visiontrack-$CI_MODE.XXXXXXXX")
          printf 'DEVELOPER_DIR=%s\nCI_RUN_DIR=%s\n' "$developer_dir" "$run_dir" >> "$GITHUB_ENV"

      - name: Run shared build/test script
        run: |
          set -euo pipefail
          set +e
          ./scripts/ios-ci.sh "$CI_MODE" 2>&1 | tee "$CI_RUN_DIR/console.log"
          command_statuses=("${PIPESTATUS[@]}")
          set -e
          if [[ ${command_statuses[0]} -ne 0 ]]; then
            exit "${command_statuses[0]}"
          fi
          exit "${command_statuses[1]}"

      - name: Collect allowlisted diagnostics
        id: diagnostics
        if: always()
        run: |
          set -euo pipefail
          if [[ -z "${CI_RUN_DIR:-}" || ! -f "$CI_RUN_DIR/console.log" ]]; then
            echo "::warning::Script did not start; no script diagnostics to collect."
            exit 0
          fi
          python3 - <<'PYTHON'
          import os
          import re
          import shutil
          import stat
          from pathlib import Path

          run_dir = Path(os.environ["CI_RUN_DIR"])
          mode = os.environ["CI_MODE"]
          # Parse as data, never as shell commands or environment assignments.
          lines = (run_dir / "console.log").read_text(errors="replace").splitlines()
          outputs = [line[len("Output: "):] for line in lines if line.startswith("Output: ")]
          if not outputs:
              print("::warning::Script stopped before creating a diagnostic directory.")
              raise SystemExit(0)
          if len(outputs) != 1 or not re.fullmatch(r"/private/tmp/visiontrack-ios-ci\.[A-Za-z0-9]{8}", outputs[0]):
              raise SystemExit("Unsafe or ambiguous script output directory")
          source = Path(outputs[0])
          if source.is_symlink() or source.resolve() != source:
              raise SystemExit("Diagnostic directory must not be a symlink")
          info = source.stat()
          if not stat.S_ISDIR(info.st_mode) or info.st_uid != os.getuid():
              raise SystemExit("Diagnostic directory is not owned by the runner user")
          candidates = [source / "environment.log", source / "xcodebuild.log"]
          if mode in ("unit", "ui"):
              candidates.append(source / (mode + ".xcresult"))
          existing = [path for path in candidates if path.exists() or path.is_symlink()]
          # Never follow a link into a checkout, simulator sandbox, or another store.
          def check_file_type(item):
              item_info = item.lstat()
              if not (stat.S_ISREG(item_info.st_mode) or stat.S_ISDIR(item_info.st_mode)):
                  raise SystemExit("Unsafe diagnostic file type: " + str(item))

          for path in existing:
              check_file_type(path)
              if path.is_dir():
                  for item in path.rglob("*"):
                      check_file_type(item)
          if not existing:
              print("::warning::No allowlisted diagnostic files were generated.")
              raise SystemExit(0)
          destination = run_dir / "artifacts"
          destination.mkdir()
          for path in existing:
              target = destination / path.name
              if path.is_dir():
                  shutil.copytree(path, target)
              else:
                  shutil.copy2(path, target)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("ready=true\n")
          print("Diagnostics staged at " + str(destination))
          PYTHON

      - name: Upload allowlisted diagnostics
        if: ${{ always() && steps.diagnostics.outputs.ready == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ios-${{ env.CI_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CI_RUN_DIR }}/artifacts/
          retention-days: 7
          if-no-files-found: error
          # The staging directory contains only the explicit diagnostic allowlist.
          include-hidden-files: true

  ui-regression:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      CI_MODE: ui
    steps: *simulator-steps

  release-build:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      CI_MODE: release
    steps: *simulator-steps
